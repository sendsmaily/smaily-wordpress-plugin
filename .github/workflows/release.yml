name: Build release package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WP_PLUGIN_NAME: smaily-connect
      WP_CLI_ALLOW_ROOT: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        tools: composer

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache PHP packages
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
          ${{ runner.os }}-

    - name: Set up Node environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Get Node cache directory
      id: node-cache
      run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: ${{ steps.node-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
          ${{ runner.os }}-

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Install Node dependencies
      run: composer run install-block-modules

    - name: Build blocks
      run: composer run build

    - name: Compile translations
      run: composer run compile-translations

    - name: Package the plugin
      run: composer run package

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.WP_PLUGIN_NAME }}.zip
        token: ${{ secrets.GITHUB_TOKEN }}
